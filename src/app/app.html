<div class="app" cdkDropListGroup>
  @if (store.doc().pages.length || store.canUndo()) {
  <div class="toolbar" role="toolbar" aria-label="Form tools">
    <button type="button" (click)="store.undo()" [disabled]="!store.canUndo()" title="Undo (Ctrl+Z)">↶ Undo</button>
    <button type="button" (click)="store.redo()" [disabled]="!store.canRedo()" title="Redo (Ctrl+Y)">↷ Redo</button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" (click)="store.copySelected()" [disabled]="!store.selection().size" title="Copy selected (Ctrl+C)">Copy</button>
    <button type="button" (click)="store.paste()" [disabled]="!store.clipboard().length" title="Paste (Ctrl+V)">Paste</button>
    <button type="button" (click)="store.deleteSelected()" [disabled]="!store.selection().size">Delete selected</button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" (click)="store.loadSample()" title="Replace the form with 1,000 questions">1,000 questions</button>
  </div>
  }

  <main class="content">
    @for (p of store.doc().pages; track p.id; let i = $index) {
      <fb-page [page]="p" [index]="i + 1" />
    }

    <div class="add" role="group" aria-label="Add to form">
      <button type="button" (click)="store.addQuestion()"><span class="ic">+</span> Question</button>
      <button type="button" (click)="store.addSection()">
        <svg class="ic" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.3" d="M2 3h12v3H2zM2 8h12v5H2z"/></svg>
        Section
      </button>
      <button type="button" (click)="store.addPage()">
        <svg class="ic" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.3" d="M3.5 1.5h6l3 3v10h-9zM9.5 1.5v3h3"/></svg>
        Add Page
      </button>
    </div>
    <p class="sr-only" aria-live="polite">{{ store.totalQuestions() }} questions in the form</p>
  </main>
</div>
